# Formula 1 · 07_doe 룰북 매니페스트 (#1), v6.1
# load_enabled: 파일 로드 여부 / enforcement_enabled: 판정 권한. 실제 집행은 modes의 최소 validation_status를 함께 만족해야 함.
# 현재 모든 행이 DRAFT_PENDING_REVIEW이므로 production 모드에서는 어떤 규칙도 집행되지 않는다.
id: 07_doe
version: '6.1'
effective_from: '2026-09-23'
evaluator:
  name: ast_whitelist_v1
  python_eval: false
  allowed_ast_nodes:
  - Add
  - And
  - Attribute
  - BinOp
  - BoolOp
  - Call
  - Compare
  - Constant
  - Div
  - Eq
  - Expression
  - GeneratorExp
  - Gt
  - GtE
  - In
  - Is
  - IsNot
  - ListComp
  - Load
  - Lt
  - LtE
  - Mult
  - Name
  - Not
  - NotEq
  - NotIn
  - Or
  - Store
  - Sub
  - Tuple
  - USub
  - UnaryOp
  - comprehension
  generator_rule: 'any/all/nonempty_all/sum/count/distinct_count은 generator expression 1개를 받는다. 변수 바인딩은 for 절에만. 빈 컬렉션: any→False,
    all→True, nonempty_all→False'
  null_policy: None과의 비교 외 연산에 None이 들어가면 missing_value_action 적용 (규칙 미발화 아님)
  const_namespace: const.X = statistical_policy_constants.constant_id
modes:
  production:
    enforce_min_validation_status: APPROVED
    evidence_DEMO_ONLY: DENY
    namespace: prod
  demo:
    enforce_min_validation_status: DRAFT_PENDING_REVIEW
    evidence_DEMO_ONLY: ALLOW
    namespace: sandbox
    note: demo 결과는 sandbox에 격리, production artifact로 승격 불가
validation_status_order:
- DRAFT_PENDING_REVIEW
- UNDER_REVIEW
- APPROVED
- RETIRED
backend_capabilities:
  FRACTIONAL_FACTORIAL:
    supported: true
    factor_types: continuous or 2-level categorical
    min_factors: 3
    max_factors: 4
  PLACKETT_BURMAN:
    supported: true
    factor_types: continuous or 2-level categorical
    min_factors: 3
    max_factors: 4
    note: Res III 경고
  BOX_BEHNKEN:
    supported: true
    factor_types: continuous only
    min_factors: 3
    max_factors: 3
  CCD:
    supported: true
    factor_types: continuous only
    min_factors: 2
    max_factors: 3
  FACE_CENTERED_CCD:
    supported: true
    factor_types: continuous only
    min_factors: 2
    max_factors: 3
  DSD:
    supported: false
    note: MVP 백엔드 미지원
  D_OPTIMAL:
    supported: false
    note: MVP 백엔드 미지원
  MIXTURE:
    supported: false
    note: MVP 백엔드 미지원
