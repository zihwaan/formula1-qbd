functions:
  len:
    arity: 1
    returns: num
    description_ko: 컬렉션 길이
  abs:
    arity: 1
    returns: num
    description_ko: 절댓값
  min:
    arity: -1
    returns: num
    description_ko: 최솟값
  max:
    arity: -1
    returns: num
    description_ko: 최댓값
  sum:
    arity: gen
    returns: num
    description_ko: 합계 (generator)
  any:
    arity: gen
    returns: bool
    description_ko: 하나라도 참 (generator). 빈 컬렉션 → False
  all:
    arity: gen
    returns: bool
    description_ko: 모두 참 (generator). 빈 컬렉션 → True — 승격 판정에는 nonempty_all 사용
  nonempty_all:
    arity: gen
    returns: bool
    description_ko: 비어 있지 않고 모두 참. 빈 컬렉션 → False
  count:
    arity: gen
    returns: num
    description_ko: 참인 원소 수 (generator)
  distinct_count:
    arity: gen
    returns: num
    description_ko: 서로 다른 값 수 (generator)
  set_intersects:
    arity: 2
    returns: bool
    description_ko: 두 목록의 교집합 존재
  matrix_rank:
    arity: 1
    returns: num
    description_ko: 설계 모형행렬 rank (plan). 수치 tolerance는 엔진 설정
  evidence_permits:
    arity: 2
    returns: bool
    description_ko: 'evidence_governance_rules 표 조회: (evidence_status, use) 허용 여부'
  recompute_fingerprint:
    arity: 1
    returns: str
    description_ko: Handoff fingerprint 재계산
  equipment_supports:
    arity: 1
    returns: bool
    description_ko: 설비가 요인을 실행 가능한가
  redundant_with_any:
    arity: 2
    returns: bool
    description_ko: 요인이 다른 요인과 중복인가
  protocol_available:
    arity: 1
    returns: bool
    description_ko: 범주 수준 실행 방법 존재
  excipient_range_exists:
    arity: 1
    returns: bool
    description_ko: 부형제 통상 사용범위 master 행 존재
  iid_reference_exists:
    arity: 1
    returns: bool
    description_ko: 외부 FDA IID snapshot 조회 가능 (의존성)
  intersection_empty:
    arity: 1
    returns: bool
    description_ko: 요인 실행 가능 범위 교집합이 비었는가
  block_confounded:
    arity: 1
    returns: bool
    description_ko: 블록이 의도 모형 항과 교락되는가
  backend_supports:
    arity: 1
    returns: bool
    description_ko: manifest backend_capabilities에 설계가 지원되는가
  convertible:
    arity: 2
    returns: bool
    description_ko: 단위 변환 가능
