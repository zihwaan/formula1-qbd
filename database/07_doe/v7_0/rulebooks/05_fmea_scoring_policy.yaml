rulebook_id: RB05_FMEA_SCORING_POLICY
version: 7.0.0
effective_from: '2026-09-26'
validation_status: DRAFT_EXPERT_REVIEW_REQUIRED
enforcement_enabled: false
dimensions:
  severity:
    1: 품질 영향이 사실상 없음
    2: 취급성·외관 영향
    3: 비critical CQA 또는 공정 성능 영향
    4: critical CQA 규격 이탈 가능
    5: 환자 안전·유효성에 직접 영향 가능
  occurrence:
    UNKNOWN: 동일 조건의 발생 근거 없음
    1: 근거로 드묾 확인
    3: 문헌·유사제품에서 보고
    5: 동일 조건 실측에서 반복 관찰
  detectability:
    1: 원인 판별력 있는 배치별 시험
    3: 간접·표본·사후 검출
    5: 등록 검출수단 없음
rules:
- id: FMEA_UNKNOWN_OCCURRENCE
  if: O == UNKNOWN
  then: do_not_calculate_RPN; retain uncertainty
- id: FMEA_HIGH_SEVERITY_PROTECTION
  if: S >= 4
  then: cannot_exclude_without_alternative_control_and_researcher_reason
- id: FMEA_DETECTABILITY_EVIDENCE
  if: D is numeric
  then: registered test_method_id and detection rationale required
- id: FMEA_RPN_USE
  if: S,O,D are numeric
  then: RPN=S*O*D; ranking aid only; never sole exclusion criterion
- id: FMEA_LLM_LABEL
  if: origin == LLM
  then: hypothesis_class=LLM_HYPOTHESIS; confirmation required
required_review_roles:
- formulation_scientist
- analytical_scientist
- study_lead
sources:
- SRC_ICH_Q9
- SPEC:v7.0
