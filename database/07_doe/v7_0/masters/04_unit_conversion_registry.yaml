master_id: M04_UNIT_CONVERSION_REGISTRY
version: 7.0.0
effective_from: '2026-09-26'
validation_status: DRAFT_EXPERT_REVIEW_REQUIRED
quantity_kinds:
  mass:
    canonical_unit: mg
    conversions:
      ug: 0.001
      mg: 1
      g: 1000
      kg: 1000000
  time:
    canonical_unit: s
    conversions:
      s: 1
      min: 60
      h: 3600
  force:
    canonical_unit: N
    conversions:
      N: 1
      kgf: 9.80665
  pressure:
    canonical_unit: MPa
    conversions:
      MPa: 1
      kPa: 0.001
      psi: 0.006894757293168
  fraction_mass:
    canonical_unit: '% w/w'
    conversions:
      '% w/w': 1
      fraction w/w: 100
  temperature:
    canonical_unit: degC
    affine_conversions:
      K_to_degC: K-273.15
      degC_to_K: degC+273.15
guards:
- conversion is allowed only within the same quantity_kind
- percent bases (%w/w, %w/v, %v/v) are never interconverted without density/composition evidence
- display rounding never changes stored canonical values
- unknown unit returns REQUEST_DATA; no fuzzy conversion
