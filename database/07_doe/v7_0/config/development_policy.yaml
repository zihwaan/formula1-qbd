policy_id: RB00_DEVELOPMENT_POLICY
version: 7.0.0
effective_from: '2026-09-26'
validation_status: DRAFT_EXPERT_REVIEW_REQUIRED
enforcement_enabled: false
scope: oral immediate-release tablets, ODT, and dispersible-tablet development demos
limits:
  max_selected_doe_responses: 4
  max_rsm_factors: 3
  recommended_rsm_factors:
  - 2
  - 3
  max_llm_hypotheses_per_review: 5
supported_default_designs:
  one_continuous_factor:
    design: ONE_FACTOR_QUADRATIC
    runs: 7
  two_continuous_factors:
    design: FCCD
    alpha: 1
    runs: 13
  three_continuous_factors:
    design: BBD
    runs: 17
unsupported_without_advanced_design:
- MIXTURE
- CATEGORICAL
- HARD_TO_CHANGE
- MORE_THAN_3_RSM_FACTORS
prototype_value_policy:
  required_value_role: REFERENCE_PROTOTYPE
  auto_copy_to_factor_center: false
  center_requires_separate_range_evidence: true
range_policy:
  new_api_direct_rsm_allowed:
  - MEASURED_PRIOR_BATCH
  - FEASIBILITY_CONFIRMED
  - VERIFIED_EXTERNAL_DATA
  literature_replay_only:
  - REPORTED_NO_RAW_DATA
  requires_feasibility:
  - REPORTED_NO_RAW_DATA
  - EXPERT_PROPOSAL
  - UNVERIFIED_PROPOSAL
  feasibility_conditions_formula: 2*k+1 axial conditions; not 2^k+1
  include_feasibility_in_rsm_fit_by_default: false
model_policy:
  strong_hierarchy_required: true
  primary_metric: LOOCV_RMSE
  selection_rule: ONE_STANDARD_ERROR_THEN_FEWEST_TERMS
  tie_breakers:
  - AICc_ASC
  - ADJUSTED_R2_DESC
  - NORMALIZED_FORMULA_ASC
  user_term_selection_required: false
human_approval_required:
- CQA_SELECTION
- FMEA_REVIEW
- FACTOR_AND_RANGE_SELECTION
- FEASIBILITY_PLAN
- DOE_PLAN
- EXECUTION_PROTOCOL
- MODEL_ACCEPTANCE_WITH_FLAGS
- VERIFICATION_PLAN
- VERIFIED_OPERATING_REGION
forbidden_states:
- CONTROL_STRATEGY
- PPQ_READY
- COMMERCIAL_RELEASE
llm_permissions:
  may:
  - propose_candidates
  - summarize_evidence
  - explain_rules
  - generate_hypotheses
  - draft_confirmation_tests
  may_not:
  - invent_numeric_values
  - mutate_rulebook
  - select_unregistered_test
  - compute_statistics
  - advance_state
